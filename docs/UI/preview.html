<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Performance Monitor</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: #11151a;
    font-family:
      "Segoe UI",
      "Microsoft YaHei",
      system-ui,
      sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .monitor {
    --bg: rgba(18, 21, 25, 0.96);
    --border: rgba(255, 255, 255, 0.10);
    --separator: rgba(255, 255, 255, 0.13);

    --text: #f3f5f7;
    --muted: #92979f;
    --icon: #9da3aa;

    --green: #74e26e;
    --blue: #4badff;
    --cyan: #33c8ff;

    display: flex;
    align-items: center;

    height: 54px;
    padding: 0 18px;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,0.025),
        rgba(255,255,255,0)
      ),
      var(--bg);

    border: 1px solid var(--border);
    border-radius: 999px;

    box-shadow:
      0 10px 35px rgba(0,0,0,.32),
      inset 0 1px rgba(255,255,255,.025);

    color: var(--text);

    user-select: none;
    white-space: nowrap;
  }

  .item {
    height: 28px;

    display: flex;
    align-items: center;
    gap: 9px;

    padding: 0 22px;

    border-right: 1px solid var(--separator);
  }

  .item:first-child {
    padding-left: 4px;
  }

  .item:last-child {
    padding-right: 4px;
    border-right: none;
  }

  .icon {
    width: 19px;
    height: 19px;

    color: var(--icon);
    flex-shrink: 0;
  }

  .label {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .2px;
  }

  .value {
    font-size: 17px;
    font-weight: 650;
    line-height: 1;

    color: var(--text);

    font-variant-numeric: tabular-nums;
  }

  .temperature {
    font-size: 16px;
    color: #9da2a9;
    font-variant-numeric: tabular-nums;
  }

  .cpu .value {
    color: var(--green);
  }

  .memory .value {
    color: var(--blue);
  }

  .gpu .value {
    color: #52d685;
  }

  .network {
    gap: 12px;
  }

  .network-value {
    display: flex;
    align-items: center;
    gap: 4px;

    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .unit {
    color: #92979f;
    font-size: 13px;
    margin-left: -2px;
  }

  .download {
    color: #27aaff;
  }

  .upload {
    color: #49dc8b;
  }

  .arrow {
    font-size: 20px;
    font-weight: 500;
    line-height: 1;
  }

  .clock-value {
    min-width: 72px;

    font-size: 16px;
    font-weight: 600;

    font-variant-numeric: tabular-nums;
  }

  /* 鼠标经过时只做非常轻微的反馈 */
  .item {
    transition:
      background .15s ease,
      opacity .15s ease;
  }

  .item:hover {
    background: rgba(255,255,255,.025);
  }
</style>
</head>

<body>

<div class="monitor">

  <!-- CPU -->
  <div class="item cpu">

    <svg class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8">
      <rect x="7" y="7" width="10" height="10" rx="1"/>
      <path d="M9 1v4M15 1v4M9 19v4M15 19v4"/>
      <path d="M1 9h4M1 15h4M19 9h4M19 15h4"/>
      <rect x="9.5" y="9.5" width="5" height="5"/>
    </svg>

    <span class="label">CPU</span>

    <span class="value">9%</span>

    <span class="temperature">62°</span>

  </div>


  <!-- Memory -->
  <div class="item memory">

    <svg class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="7" width="18" height="10" rx="1"/>
      <path d="M6 10v4M9 10v4M12 10v4M15 10v4M18 10v4"/>
      <path d="M6 17v2M10 17v2M14 17v2M18 17v2"/>
    </svg>

    <span class="label">内存</span>

    <span class="value">51%</span>

  </div>


  <!-- GPU -->
  <div class="item gpu">

    <svg class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="6" width="18" height="12" rx="1"/>
      <circle cx="10" cy="12" r="3"/>
      <circle cx="16" cy="12" r="2"/>
      <path d="M21 9h2M21 15h2"/>
    </svg>

    <span class="label">GPU</span>

    <span class="value">0%</span>

    <span class="temperature">29°</span>

  </div>


  <!-- Network -->
  <div class="item network">

    <svg class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18"/>
      <path d="M12 3a15 15 0 0 1 0 18"/>
      <path d="M12 3a15 15 0 0 0 0 18"/>
    </svg>

    <span class="label">网络</span>

    <span class="network-value">
      <span class="arrow download">↓</span>
      <span>0.0</span>
      <span class="unit">MB/s</span>
    </span>

    <span class="network-value">
      <span class="arrow upload">↑</span>
      <span>0.0</span>
      <span class="unit">MB/s</span>
    </span>

  </div>


  <!-- Clock -->
  <div class="item clock">

    <svg class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3 2"/>
    </svg>

    <span
      id="clock"
      class="clock-value">
      19:30:50
    </span>

  </div>

</div>


<script>
  function updateClock() {
    const now = new Date();

    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    const s = String(now.getSeconds()).padStart(2, "0");

    document.getElementById("clock").textContent =
      `${h}:${m}:${s}`;
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
